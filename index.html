<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liz Daily Accounts</title>
<style>
:root{--bg:#f6f4ee;--ink:#1d2b28;--mut:#66726f;--line:#d9d5c8;--brand:#17594a;--brand2:#e9f1ee;--err:#b3261e;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#141a18;--ink:#e8eeeb;--mut:#92a09b;--line:#2c3935;--brand:#5fb59e;--brand2:#1d2b27;--err:#f2b8b5;--card:#1b2320}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,"Noto Sans Bengali",sans-serif}
header{padding:18px 16px 8px;max-width:760px;margin:auto}
h1{margin:0;font-size:22px}
header p{margin:2px 0 0;color:var(--mut);font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;max-width:760px;margin:auto}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
main{max-width:760px;margin:auto;padding:0 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:8px}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.save{margin-top:16px;width:100%;padding:12px;border:0;border-radius:8px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.save:disabled{opacity:.6}
.calc{margin-top:12px;padding:10px;border-radius:8px;background:var(--brand2);font-size:14px}
#msg{margin-top:10px;font-size:14px;min-height:20px}
#msg.err,#lmsg{color:var(--err)}
.tbl{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
h2{font-size:16px;margin:22px 0 0}
#lock{max-width:320px;margin:60px auto;padding:16px}
</style>
</head>
<body>

<div id="lock" class="card">
  <h1>Liz Daily Accounts</h1>
  <label for="pin">PIN</label>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off">
  <button class="save" id="enter">Dhukun</button>
  <div id="lmsg" style="margin-top:8px;font-size:14px"></div>
</div>

<div id="app" hidden>
  <header><h1>Liz Fashion – Daily Accounts</h1><p>Ekhane entry dile sheet-e sathe sathe add hobe.</p></header>
  <nav id="tabs"></nav>
  <main>
    <div class="card">
      <div id="fields"></div>
      <div id="calc" class="calc" hidden></div>
      <button class="save" id="save">Save korun</button>
      <div id="msg" role="status"></div>
    </div>
    <h2>Sesh 10 ti entry</h2>
    <div class="tbl" id="recent"></div>
  </main>
</div>

<script>
// ===== EKHANE APNAR WEB APP URL BOSHAN (Deploy korar por pabe) =====
const APP_URL = 'https://script.google.com/macros/s/AKfycbxd8zXJAlK0SV6vv5B05mQ3lxjJQ2Rkr0MT6Koxe9jbGbPVaEJjClcxV1BPGzxQpBS-FQ/exec';
// ====================================================================

const F = {
  expense:{title:'Expense',fields:[
    ['date','Tarikh','date'],['name','Expense name','text'],['note','Note / karon','textarea'],
    ['amount','Amount (tk)','number'],['code','Expense code (IE...)','text'],
    ['status','Status','select',['entry done','pending','approved']]]},
  cash:{title:'Cash In / Out',fields:[
    ['date','Tarikh','date'],['kind','Dhoron','select',['Cash In','Cash Out']],
    ['note','Note','text'],['amount','Amount (tk)','number']]},
  recovery:{title:'Recovery',fields:[
    ['date','Tarikh','date'],['custId','Customer ID','text'],['custName','Customer name','text'],
    ['amount','Amount (tk)','number'],['exchange','Exchange with cash','number'],['remarks','Remarks','text']]},
  baki:{title:'Baki taka pabo',fields:[
    ['date','Tarikh','date'],['name','Customer name + ID','text'],['amount','Amount (tk)','number'],
    ['reason','Karon','textarea']]},
  daily:{title:'Daily Cash Summary',fields:[
    ['date','Tarikh','date'],['prev','Previous Ledger','number'],['ibos','IBOS Cash Sales','number'],
    ['recov','Recovery Sales','number'],['cashin','Cash In','number'],['expense','Expense','number'],
    ['cashout','Cash Out','number'],['cod','COD','number']]}
};
let cur='expense', PIN='';
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};

async function call(action,type,d){
  const r=await fetch(APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action,type,d,pin:PIN})});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'Error');
  return j.data;
}
function say(t,err){const m=$('msg');m.textContent=t;m.className=err?'err':''}

function tabs(){
  $('tabs').innerHTML='';
  Object.keys(F).forEach(k=>{
    const b=document.createElement('button');b.textContent=F[k].title;
    if(k===cur)b.className='on';
    b.onclick=()=>{cur=k;tabs();form();recent()};
    $('tabs').appendChild(b);
  });
}
function form(){
  const box=$('fields');box.innerHTML='';say('');
  F[cur].fields.forEach(([id,lab,type,opts])=>{
    const l=document.createElement('label');l.htmlFor='f_'+id;l.textContent=lab;box.appendChild(l);
    let el;
    if(type==='select'){el=document.createElement('select');opts.forEach(o=>{const op=document.createElement('option');op.textContent=o;el.appendChild(op)})}
    else if(type==='textarea'){el=document.createElement('textarea');el.rows=2}
    else{el=document.createElement('input');el.type=type;if(type==='number'){el.inputMode='decimal';el.step='any'}}
    el.id='f_'+id;if(type==='date')el.value=today();
    el.oninput=calc;box.appendChild(el);
  });
  calc();
}
const val=id=>$('f_'+id).value;
function calc(){
  const c=$('calc');
  if(cur!=='daily'){c.hidden=true;return}
  const n=id=>Number(val(id))||0;
  const total=n('prev')+n('ibos')+n('recov')+n('cashin');
  const ledger=total-n('expense')-n('cashout')-n('cod');
  c.hidden=false;c.textContent='Total: '+total+' tk  |  Ledger Amount: '+ledger+' tk';
}
async function recent(){
  $('recent').textContent='Loading...';
  try{
    const r=await call('recent',cur);
    if(!r.rows.length){$('recent').textContent='Ekhono kono entry nei.';return}
    let h='<table><tr>'+r.head.map(x=>'<th>'+x+'</th>').join('')+'</tr>';
    r.rows.forEach(row=>h+='<tr>'+row.map(x=>'<td>'+String(x).replace(/</g,'&lt;')+'</td>').join('')+'</tr>');
    $('recent').innerHTML=h+'</table>';
  }catch(e){$('recent').textContent=e.message}
}
$('save').onclick=async()=>{
  const d={};F[cur].fields.forEach(([id])=>d[id]=val(id));
  if(!d.date){say('Tarikh din',1);return}
  $('save').disabled=true;say('Save hochche...');
  try{
    await call('save',cur,d);
    say('Save hoyeche ✓');
    F[cur].fields.forEach(([id,,t])=>{if(t!=='date'&&t!=='select')$('f_'+id).value=''});
    calc();recent();
  }catch(e){say(e.message,1)}
  $('save').disabled=false;
};
$('enter').onclick=async()=>{
  PIN=$('pin').value;$('lmsg').textContent='';
  if(!APP_URL||APP_URL.indexOf('script.google.com')<0){$('lmsg').textContent='APP_URL boshano hoyni';return}
  try{await call('recent','expense');$('lock').hidden=true;$('app').hidden=false;tabs();form();recent()}
  catch(e){$('lmsg').textContent=e.message==='Failed to fetch'?'Server er sathe connect hoy nai':e.message}
};
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('enter').click()});
</script>
</body>
</html>
